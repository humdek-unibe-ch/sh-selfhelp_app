<span>
  @switch (getFieldContent('level')) {
    @case ('1') {
      <h1 [class]="getCss()" [innerHTML]="getFieldContent('title')"></h1>
    }
    @case ('2') {
      <h2 [class]="getCss()" [innerHTML]="getFieldContent('title')"></h2>
    }
    @case ('3') {
      <h3 [class]="getCss()" [innerHTML]="getFieldContent('title')"></h3>
    }
    @case ('4') {
      <h4 [class]="getCss()" [innerHTML]="getFieldContent('title')"></h4>
    }
    @case ('5') {
      <h5 [class]="getCss()" [innerHTML]="getFieldContent('title')"></h5>
    }
    @case ('6') {
      <h6 [class]="getCss()" [innerHTML]="getFieldContent('title')"></h6>
    }
    @default {
      <h1 [class]="getCss()" [innerHTML]="getFieldContent('title')"></h1>
    }
  }
</span>
